<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		    <meta name="viewport" content="width=device-width, initial-scale=1.0">
		    <title>Dashboard</title>

		    <!-- Bootstrap CDN -->
		    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">

		    <!-- Font Awesome CDN (optional for icons) -->
		    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
	</head>
	<body class="container-fluid">
		<form class="d-flex align-items-end gap-3 mb-4" th:object="${enqDto}" th:action="@{/filter}" method="post">
		    <div>
		        <label for="classMode" class="form-label">Class Mode</label>
		        <select th:field="*{classMode}" class="form-select" id="classMode" >
		            <option value="" selected>Select Mode</option>
		            <option value="Online">Online</option>
		            <option value="Offline">Offline</option>
		        </select>
		    </div>

		    <div >
		        <label for="courseName" class="form-label">Course Name</label>
		        <select th:field="*{courseName}" class="form-select" id="courseName" >
		            <option value="" selected>Select Course</option>
		            <option value="Java Fullstack">Java Fullstack</option>
		            <option value="Python Fullstack">Python Fullstack</option>
		            <option value="AWS Cloud">AWS Cloud</option>
		            <option value="Data Science">Data Science</option>
		            <option value="DevOps">DevOps</option>
		            <option value="UI/UX Design">UI/UX Design</option>
		        </select>
		    </div>

		    <div >
		        <label for="enqStatus" class="form-label">Enquiry Status</label>
		        <select th:field="*{enqStatus}" class="form-select" id="enqStatus">
		            <option value="" selected>Select Status</option>
		            <option value="Open">New</option>
		            <option value="Enrolled">Enrolled</option>
		            <option value="Lost">Lost</option>
		        </select>
		    </div>

		    <div  class="d-flex align-items-end">
		        <button type="submit" class="btn btn-primary mt-2">Filter</button>
		    </div>
		</form>

		<table class="table">
			<tr>
				<th scope="col">
					Name
				</th>
				<th scope="col">
					Phno
				</th>
				<th scope="col">
					Course Name
				</th>
				<th scope="col">
					Class Mode
				</th>
				<th scope="col">
					Status
				</th>
				<th scope="col">
					Action
				</th>
			</tr>
			<tr th:each="enq: ${enquiries}">
				<td th:text="${enq.name}">Name</td>
				<td th:text="${enq.phno}">Phno</td>
				<td th:text="${enq.courseName}">Course name</td>
				<td th:text="${enq.classMode}">Class Mode</td>
				<td th:text="${enq.enqStatus}">Enquiry Status</td>
				<td >
					<a th:href="@{/edit(enqId=${enq.enqId})}">Edit</a>	
				</td>	
			</tr>
		</table>
	</body>
</html>
