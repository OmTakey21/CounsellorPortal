<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Enquiry</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Add Enquiry</h1>

        <!-- Success Message -->
        <div th:if="${smsg}" class="alert alert-success" role="alert" th:text="${smsg}"></div>

        <!-- Error Message -->
        <div th:if="${emsg}" class="alert alert-danger" role="alert" th:text="${emsg}"></div>

        <!-- Enquiry Form -->
        <form th:action="@{/enquiry}" th:object="${enquiry}" method="post">

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Enter Name" required>
            </div>

            <div class="mb-3">
                <label for="phno" class="form-label">Phone Number</label>
                <input type="text" th:field="*{phno}" class="form-control" id="phno" placeholder="Enter Phone Number" required>
            </div>

            <div class="mb-3">
                <label for="classMode" class="form-label">Class Mode</label>
                <select th:field="*{classMode}" class="form-select" id="classMode" required>
                    <option value="" disabled selected>Select Mode</option>
                    <option value="Online">Online</option>
                    <option value="Offline">Offline</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="courseName" class="form-label">Course Name</label>
                <select th:field="*{courseName}" class="form-select" id="courseName" required>
                    <option value="" disabled selected>Select Course</option>
                    <option value="Java Fullstack">Java Fullstack</option>
                    <option value="Python Fullstack">Python Fullstack</option>
                    <option value="AWS Cloud">AWS Cloud</option>
                    <option value="Data Science">Data Science</option>
                    <option value="DevOps">DevOps</option>
                    <option value="UI/UX Design">UI/UX Design</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="enqStatus" class="form-label">Enquiry Status</label>
                <select th:field="*{enqStatus}" class="form-select" id="enqStatus" required>
                    <option value="" disabled selected>Select Status</option>
                    <option value="New">New</option>
                    <option value="Enrolled">Enrolled</option>
                    <option value="Lost">Lost</option>
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Submit Enquiry</button>
                <a href="/dashboard" class="btn btn-secondary ms-2">Back to Dashboard</a>
            </div>

        </form>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
