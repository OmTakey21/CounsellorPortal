<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CDN (optional for icons) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
		
		<div class="row mb-4">
		           <div class="col-md-12 text-end">
		               <a href="/logout" class="btn btn-danger btn-sm">Logout</a> <!-- Logout Button -->
		               <a href="/view-enquiries" class="btn btn-info btn-sm ms-2">View Enquiries</a> <!-- View Enquiries Link -->
		               <a href="/enquiry" class="btn btn-success btn-sm ms-2">Add Enquiry</a> <!-- Add Enquiry Link -->
		           </div>
		 </div>
        <!-- Page Heading -->
        <h1 class="text-center mb-4">Dashboard</h1>

        <!-- Card Section -->
        <div class="row">
            <div class="col-md-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h5 class="card-title">Total Enquiries</h5>
                        <p class="card-text" th:text="${dashDto.totalEnqs}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5 class="card-title">Enrolled Enquiries</h5>
                        <p class="card-text" th:text="${dashDto.enrolledEnqs}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-white">
                    <div class="card-body">
                        <h5 class="card-title">Open Enquiries</h5>
                        <p class="card-text" th:text="${dashDto.openEnqs}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-danger text-white">
                    <div class="card-body">
                        <h5 class="card-title">Lost Enquiries</h5>
                        <p class="card-text" th:text="${dashDto.lostEnqs}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Additional Section (Optional) -->
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Other Information</h5>
                        <p>Any additional data or links can go here.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS & Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
